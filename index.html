<style>
:root{--bg:#f6f4fb;--pn:#fff;--rs:#efeaf8;--ln:#ddd5ee;--tx:#1b1530;--mu:#6b6384;--mg:#a21caf;--cy:#0e7490;--gr:#15803d;--am:#b45309;--rd:#be123c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0713;--pn:#171025;--rs:#1f1733;--ln:#2d2440;--tx:#ede9f7;--mu:#9a92b5;--mg:#e879f9;--cy:#22d3ee;--gr:#4ade80;--am:#fb923c;--rd:#fb7185;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0713;--pn:#171025;--rs:#1f1733;--ln:#2d2440;--tx:#ede9f7;--mu:#9a92b5;--mg:#e879f9;--cy:#22d3ee;--gr:#4ade80;--am:#fb923c;--rd:#fb7185;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
main{max-width:860px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--mu);font-size:12.5px;margin:2px 0 14px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
nav button{white-space:nowrap;border:1px solid var(--ln);background:var(--pn);color:var(--mu);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:12.5px}
nav button.on{background:var(--mg);color:#fff;border-color:var(--mg)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.bar{height:8px;background:var(--rs);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.row{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:13px}
.row input{margin-top:3px;accent-color:var(--mg);width:16px;height:16px;flex-shrink:0}
.row.d span{text-decoration:line-through;color:var(--mu)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--rs);color:var(--mu)}
.mh{display:flex;gap:10px;align-items:center;cursor:pointer}
.mh b{flex:1;font-size:13.5px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--cy);margin:10px 0 3px}
textarea,input[type=date]{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font:inherit;font-size:12.5px}
.btn{border:0;background:var(--mg);color:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;font:inherit;font-size:12.5px;margin-top:8px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mini{background:var(--rs);border-radius:10px;padding:10px;font-size:12.5px}
.mini b{display:block;margin-bottom:2px}
.t{color:var(--mu);font-size:12px;min-width:92px}
.f{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font:inherit;font-size:12.5px;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 10px;background:var(--rs);color:var(--tx);border:1px solid var(--ln);border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
a{color:var(--cy)}
.opt.ok{border-color:var(--gr)}.opt.bad{border-color:var(--rd)}
</style>
</head>
<body>
<main>

<nav id="nav"></nav>
<div id="app"></div>
</main>
<script>
const PH=["Fundamentos","Consolidação técnica","Imersão ofensiva","Portfólio","Especialização","Emprego"];
const M=[
{t:"Base sólida: Python + terminal",f:1,foco:"Fechar lacunas de Python (laços, funções, dicionários, arquivos) e ganhar fluência no terminal.",k:["Estudonauta: Python Mundos 1 e 2 (revisando o que já sabe)","Escrever 15 scripts curtos sem copiar (IMC, conversor, validador de CPF)","OverTheWire Bandit até o nível 15","Git: branch, merge, push e pull no GitHub","Terminal: permissões (chmod/chown), pipes, grep e find"],p:"Primeiro repositório no GitHub com README",c:"Cria um usuário, ajusta permissões e escreve um script que conta palavras de um arquivo, sem consultar."},
{t:"Python intermediário + OOP + Git",f:1,foco:"Estruturar programas em funções, módulos e classes, com testes.",k:["Funções, módulos, try/except e pytest","Classes, herança e composição","Projeto: Organizador de Downloads","Git com commits pequenos e Pull Requests","Cisco NetAcad: iniciar Networking Basics"],p:"Organizador de Downloads no GitHub",c:"Explica lista vs dicionário e resolve um merge conflict simples."},
{t:"Redes + SQL",f:2,foco:"Entender como computadores conversam e como dados são guardados: base de qualquer pentest.",k:["Concluir Cisco Networking Basics","OSI/TCP-IP, IP, DNS, subnetting básico","ip, ss, ping, dig e curl -v: entender cada campo","SQL: SELECT, JOIN, GROUP BY (SQLite/PostgreSQL)","Wireshark: capturar e ler uma requisição HTTP"],p:"Agenda de contatos em CLI com classes e banco SQLite",c:"Explica o caminho de uma requisição do navegador até o servidor."},
{t:"Web, HTTP e APIs com FastAPI",f:2,foco:"Construir backends reais e entender HTTP por dentro.",k:["HTTP: métodos, status, headers e cookies","FastAPI: rotas, validação e SQLAlchemy","Roadmap OS: secret por ambiente + Jinja2","Cisco Introduction to Cybersecurity","Currículo v1, LinkedIn e GitHub organizados"],p:"Roadmap OS com templates Jinja2",c:"Constrói uma API com autenticação simples e testes."},
{t:"OWASP Top 10 na prática",f:3,foco:"A prática ofensiva vira o centro: reconhecer e explorar falhas web em ambiente legal.",k:["TryHackMe: Pre Security e Jr Penetration Tester (parte)","PortSwigger Academy: SQL injection, XSS e access control","1 exemplo prático para cada item do OWASP Top 10","Roadmap OS: testes HTTP de autenticação e CSRF","Ler 1 write-up de segurança em inglês por semana"],p:"Diário de labs resolvidos (write-ups próprios)",c:"Explora uma SQL injection em lab e explica como corrigir."},
{t:"Python para segurança + 1ªs candidaturas",f:3,foco:"Automatizar tarefas de segurança com Python e começar a se candidatar.",k:["Scripts: port scanner, verificador de hash, parser de logs","AWS Skill Builder: Cloud Practitioner Essentials","Mapear 20 vagas reais (dev júnior e SOC/segurança)","Começar candidaturas (5 por semana)","Roadmap OS: modelo de Roadmap e CRUD"],p:"Repositório de ferramentas de segurança em Python",c:"Escreve um scanner de portas simples e explica cada linha."},
{t:"Portfólio: Roadmap OS completo",f:4,foco:"Transformar o projeto atual em peça central do portfólio.",k:["CRUD de roadmaps e itens com autorização por usuário","Caderno de notas privado","Testes de autorização (usuário A não acessa dados de B)","README com arquitetura e como rodar","Alembic: primeira migration"],p:"Roadmap OS v1 funcional",c:"Qualquer pessoa clona o repositório e roda o projeto seguindo o README."},
{t:"Home lab de pentest + relatório",f:4,foco:"Simular um pentest do início ao fim e escrever o relatório profissional.",k:["VM isolada com Juice Shop ou DVWA","Pentest nas 6 fases (nmap, Burp, sqlmap)","Relatório com 3 achados, severidade e correção","picoCTF/HackTheBox: 5 desafios fáceis","Candidaturas: 5 a 10 por semana"],p:"Relatório de pentest em PDF/Markdown",c:"Entrega um relatório que uma pessoa não técnica consegue entender."},
{t:"Especialização + certificação",f:5,foco:"Escolher uma direção (AppSec, redes ou SOC) e se preparar para a certificação.",k:["Decidir: web/AppSec, redes/infra ou SOC/blue team","Estudar para eJPT ou Security+","Burp Suite e Metasploit em labs","Cisco: Ethical Hacker ou CyberOps, conforme o foco","Entrevistas técnicas simuladas"],p:"Plano de estudo da certificação escolhida",c:"Resolve labs da especialização sem olhar o guia."},
{t:"Projeto flagship: construir e atacar",f:5,foco:"Provar que você constrói e também quebra: atacar o próprio Roadmap OS.",k:["Pentest no próprio Roadmap OS","Corrigir cada falha e documentar antes/depois","Deploy com HTTPS, logs e backups","Prestar a certificação escolhida","Escrever 1 artigo técnico sobre o projeto"],p:"Roadmap OS + relatório de autoataque",c:"Mostra o código e o relatório lado a lado numa entrevista."},
{t:"Candidaturas e entrevistas",f:6,foco:"Volume e feedback real: cada entrevista ensina algo.",k:["10 candidaturas por semana","Treinar entrevista: lógica, SQL, HTTP e OWASP","Networking: comunidades, eventos e LinkedIn","Revisar currículo com feedback real","Desafios de código (HackerRank/Exercism)"],p:"Planilha de candidaturas e aprendizados",c:"Participou de entrevistas técnicas reais."},
{t:"Polimento e fechamento",f:6,foco:"Consolidar portfólio, fechar uma posição e definir o próximo ano.",k:["Atualizar README dos projetos","Testes técnicos e entrevistas finais","Definir próximo ano: OSCP, AppSec ou cloud security","Retrospectiva dos 12 meses","Concluir o técnico do Senac"],p:"Portfólio final publicado",c:"Sabe exatamente o que estudar depois."}
];
const ROT=["07:30 Terminal Linux (30 min): um comando novo + prática","08:30 Teoria: Estudonauta, Cisco ou AWS (2h30)","11:00 Prática de código: Python/FastAPI (1h30)","14:00 Projeto: Roadmap OS ou portfólio (2h30)","16:30 Laboratório de segurança: TryHackMe, PortSwigger ou Bandit (1h30)","19:00 Senac EAD: matérias do técnico (1h30)","21:00 Inglês técnico + diário de estudos (30 min)"];
const PM=["Secret externo (fora do código)","Migrar HTML para Jinja2","Acesso centralizado ao usuário atual","Testes HTTP de autenticação","Revisar cookies e sessão","Commit do marco de autenticação","CSRF e rate limiting","Modelo real de Roadmap e itens","CRUD com autorização","Caderno de notas","Migrations com Alembic","Deploy com HTTPS, logs e backups"];
const CERT=[["Cisco NetAcad","Networking Basics, Intro to Cybersecurity, Ethical Hacker (cursos gratuitos, conferir catálogo)"],["AWS Skill Builder","Cloud Practitioner Essentials como base de nuvem"],["CompTIA Security+","Mais pedida em vagas corporativas e SOC"],["eJPT","Primeiro certificado prático de pentest"],["Plataformas","TryHackMe, PortSwigger Academy, OverTheWire, picoCTF, HackTheBox"]];
const EMP=[["Mês 4","Currículo v1, LinkedIn e GitHub organizados"],["Mês 6","Início oficial das candidaturas, mesmo sem se sentir 100% pronto"],["Mês 7–8","5 a 10 candidaturas por semana + networking"],["Mês 9–10","Entrevistas técnicas e certificação"],["Mês 11–12","Intensificar até fechar uma posição"]];
const KEY="roadmap_ti_v1";
let S={d:{},n:{},day:{},pj:{},lab:{},gq:[],ga:{},labv:0,ms:{},ev:[],ct:{},dn:{},pin:"",salt:"",start:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)},tab="hoje",open={};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(S.labv!==2){S.lab={};S.ga={};S.labv=2}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const mProg=i=>M[i].k.filter((_,j)=>S.d[i+"_"+j]).length;
const total=()=>Math.round(M.reduce((a,_,i)=>a+mProg(i),0)/(M.length*5)*100);
function curMonth(){const d=Math.floor((new Date(today())-new Date(S.start))/864e5);return Math.min(11,Math.max(0,Math.floor(d/30)))}
function bar(p){return `<div class="bar"><i style="width:${p}%"></i></div>`}
function chk(on,fn,txt){return `<label class="row ${on?"d":""}"><input type="checkbox" ${on?"checked":""} onchange="${fn}"><span>${esc(txt)}</span></label>`}
function tg(k){S.d[k]=!S.d[k];save();render()}
function tgDay(i){const t=today();S.day[t]=S.day[t]||{};S.day[t][i]=!S.day[t][i];save();render()}
function tgPj(i){S.pj[i]=!S.pj[i];save();render()}
function tgOpen(i){open[i]=!open[i];render()}
function setNote(i,v){S.n[i]=v;save()}
function setStart(v){if(v){S.start=v;save();render()}}
function streak(){let n=0,d=new Date(today());for(;;){const k=d.toISOString().slice(0,10),x=S.day[k];const c=x?Object.values(x).filter(Boolean).length:0;if(c>=4)n++;else if(k!==today())break;d.setDate(d.getDate()-1);if(n>400)break}return n}
const V={
hoje(){const t=today(),x=S.day[t]||{},c=ROT.filter((_,i)=>x[i]).length,m=curMonth(),mo=M[m];
const nxt=mo.k.map((s,j)=>[s,j]).filter(([s,j])=>!S.d[m+"_"+j]).slice(0,3);
return `<div class="card"><h2>Hoje · ${t.split("-").reverse().join("/")}</h2>${bar(Math.round(c/ROT.length*100))}<p class="sub">${c}/${ROT.length} blocos · sequência: ${streak()} dia(s) com 4+ blocos</p>${ROT.map((r,i)=>chk(x[i],`tgDay(${i})`,r)).join("")}<p class="sub">Tempo livre não é obrigação: 7 a 9h de foco real rendem mais que 24h. Durma bem e faça pausas.</p></div>
<div class="card"><h2>Mês ${m+1}: ${esc(mo.t)}</h2><p class="sub">${esc(mo.foco)}</p><div class="k">Próximas tarefas</div>${nxt.length?nxt.map(([s,j])=>chk(false,`tg('${m}_${j}')`,s)).join(""):"<p>Mês concluído! Avance para o próximo no Roadmap.</p>"}<div class="k">Data de início do roadmap</div><input type="date" value="${S.start}" onchange="setStart(this.value)"></div>
<div class="card"><h2>Diário do dia</h2><textarea rows="3" oninput="S.dn[today()]=this.value;save()" placeholder="O que aprendi hoje? O que travou?">${esc(S.dn[t]||"")}</textarea><div class="k">Últimos 7 dias</div><div style="display:flex;gap:6px">${last7()}</div></div>
${evCard(3)}`},
roadmap(){const sm=M.map((_,i)=>mProg(i));
return `<div class="card"><h2>Progresso geral: ${total()}%</h2>${bar(total())}<div class="g2" style="margin-top:12px">${PH.map((p,f)=>{const ids=M.map((m,i)=>m.f===f+1?i:-1).filter(i=>i>=0),v=Math.round(ids.reduce((a,i)=>a+sm[i],0)/(ids.length*5)*100);return `<div class="mini"><b>Fase ${f+1} · ${p}</b>${bar(v)}</div>`}).join("")}</div></div>`+
M.map((m,i)=>`<div class="card"><div class="mh" onclick="tgOpen(${i})"><span class="tag mono">Mês ${i+1}</span><b>${esc(m.t)}</b><span class="tag">${sm[i]}/5</span></div>${bar(sm[i]*20)}${open[i]?`<p class="sub">${esc(m.foco)}</p>${m.k.map((s,j)=>chk(S.d[i+"_"+j],`tg('${i}_${j}')`,s)).join("")}<div class="k">Projeto</div>${esc(m.p)}<div class="k">Checkpoint</div>${esc(m.c)}<div class="k">Minhas notas</div><textarea rows="3" oninput="setNote(${i},this.value)">${esc(S.n[i]||"")}</textarea>`:""}</div>`).join("")},
projetos(){const c=PM.filter((_,i)=>S.pj[i]).length;
return `<div class="card"><h2>Roadmap OS: marcos do projeto (${c}/${PM.length})</h2>${bar(Math.round(c/PM.length*100))}<p class="sub">Sequência vinda da sua documentação. Primeiro segurança da autenticação, depois funcionalidades de produto.</p>${PM.map((s,i)=>chk(S.pj[i],`tgPj(${i})`,s)).join("")}</div>
<div class="card"><h2>Projetos de portfólio</h2><div class="g2"><div class="mini"><b>1 · Organizador de Downloads</b>Mês 2. Python + Git + README.</div><div class="mini"><b>2 · Roadmap OS</b>Meses 4 a 7. FastAPI, SQLAlchemy, Argon2, testes.</div><div class="mini"><b>3 · Home lab + relatório</b>Mês 8. Pentest em ambiente próprio.</div><div class="mini"><b>4 · Autoataque documentado</b>Meses 9 a 10. Construir e quebrar o Roadmap OS.</div></div></div>`},
carreira(){return `${certCard()}<div class="card"><h2>Plataformas e cursos</h2>${CERT.map(c=>`<div class="mini" style="margin-bottom:8px"><b>${c[0]}</b>${c[1]}</div>`).join("")}<p class="sub">Confira preços e catálogos atuais nos sites oficiais. Priorize prática gratuita antes de pagar exames.</p></div><div class="card"><h2>Rumo ao emprego</h2>${EMP.map(e=>`<div class="row"><span class="t mono">${e[0]}</span><span>${e[1]}</span></div>`).join("")}<p class="sub">Para pentest e SOC júnior, portfólio prático e relatórios pesam mais que certificado isolado. Pratique somente em ambientes próprios ou autorizados.</p></div>`},
backup(){return instCard()+lockCard()+`<div class="card"><h2>Exportar / importar</h2><p class="sub">Copie o texto abaixo para guardar ou levar para outro aparelho.</p><textarea id="ex" rows="5" readonly>${esc(JSON.stringify(S))}</textarea><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('ex').value)">copiar</button><div class="k">Importar</div><textarea id="im" rows="4" placeholder="Cole o JSON aqui"></textarea><button class="btn" onclick="imp()">importar</button><p id="msg" class="sub"></p></div>`}};
function imp(){try{S=Object.assign(S,JSON.parse(document.getElementById("im").value));save();render()}catch(e){document.getElementById("msg").textContent="JSON inválido."}}

async function genQ(){const t=document.getElementById("gt").value.trim();gn=+document.getElementById("gn").value;gl=document.getElementById("gl").value;gt=t;if(!t){gerr="Escolha ou digite um tema.";render();return}gbusy=true;gerr="";render();try{const sm=typeof claude!=="undefined"?await claude.use("sample"):null;if(!sm){gerr="O gerador só funciona no link publicado dentro do Claude. Aqui use as questões prontas.";gbusy=false;render();return}const r=await sm.json(`Crie ${gn} questões de múltipla escolha em português do Brasil sobre "${t}", nível ${gl}, para quem estuda TI (desenvolvimento e cibersegurança). Responda SOMENTE um array JSON de objetos {"q":"pergunta","o":["a","b","c","d"],"a":índice da correta de 0 a 3,"e":"explicação curta"}. Varie a posição da resposta correta, use alternativas plausíveis e nada que ensine a invadir sistemas de terceiros.`);const L=(Array.isArray(r)?r:r.questoes||[]).filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length===4&&x.a>=0&&x.a<4);if(!L.length)throw 0;S.gq=L.map(x=>({t,q:x.q,o:x.o,a:x.a,e:x.e||""}));S.ga={};save()}catch(e){gerr=e&&e.code==="not_granted"?"Permissão negada. Recarregue a página e aceite para gerar.":"Não consegui gerar agora. Tente de novo."}gbusy=false;render()}
function ansG(i,o){if(S.ga[i]===undefined){S.ga[i]=o;save();render()}}
function genList(){if(!S.gq.length)return"";const ok=S.gq.filter((q,i)=>S.ga[i]===q.a).length,r=Object.keys(S.ga).length;return `<div class="card"><h2>Questões geradas: ${esc(S.gq[0].t)}</h2><p class="sub">Acertos: ${ok}/${r} · ${S.gq.length} questões</p>${bar(r?Math.round(ok/r*100):0)}<button class="btn" onclick="S.gq=[];S.ga={};save();render()">limpar geradas</button></div>`+S.gq.map((q,i)=>{const a=S.ga[i],d=a!==undefined;return `<div class="card"><span class="tag">${esc(q.t)}</span><p><b>${esc(q.q)}</b></p>${q.o.map((o,j)=>`<button class="opt ${d?(j===q.a?"ok":j===a?"bad":""):""}" onclick="ansG(${i},${j})">${esc(o)}</button>`).join("")}${d?`<p class="sub">${a===q.a?"✅ Correto. ":"❌ Não foi dessa vez. "}${esc(q.e)}</p>`:""}</div>`}).join("")}
const _lab=V.lab;V.lab=()=>genCard()+genList()+_lab();
let dip=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;render()});
function instCard(){return `<div class="card"><h2>Instalar como app</h2>${dip?`<button class="btn" onclick="dip.prompt()">instalar</button>`:`<p class="sub">Se o botão não aparecer, use o menu do navegador: Instalar app (PC) ou Adicionar à tela inicial (celular). Precisa de https ou localhost.</p>`}</div>`}
function go(t){tab=t;render()}
let unlocked=false;function render(){if(S.pin&&!unlocked){lockScreen();return}const T=[["hoje","Hoje"],["roadmap","Roadmap"],["agenda","Agenda"],["notas","Notas"],["lab","Laboratório"],["pentest","Pentest"],["comandos","Comandos"],["fontes","Fontes"],["projetos","Projetos"],["carreira","Carreira"],["backup","Conta"]];
document.getElementById("nav").innerHTML=T.map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
document.getElementById("app").innerHTML=V[tab]()}
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
